# action.yml
name: "Fail on found"
author: "Adriaan van Rossum"
description: "Fail when a certain string is found"
branding:
  icon: "search"
  color: "red"
inputs:
  query:
    description: "What string to search for in your files"
    required: true
  exclude:
    description: "What folders to exclude"
    required: false
    default: "node_modules,.git,build,.tmp,tmp"
  warn:
    description: "Set to true to warn instead of failing the job"
    required: false
    default: "false"
runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - ${{ inputs.query }}
    - ${{ inputs.exclude }}
